[project]
name = "cyberlab"
version = "0.7.0"
description = "Framework for building reproducible cybersecurity laboratories."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"

authors = [
    { name = "Guilherme Cintra", email = "gui.gccintra@gmail.com" }
]

keywords = [
    "cybersecurity",
    "docker",
    "lab",
    "pentest",
    "security",
    "education",
]

classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Operating System :: POSIX :: Linux",
    "Topic :: Security",
]

dependencies = [
    "pyyaml>=6.0.3,<7",
    "rich>=15,<16",
    "typer>=0.16,<1",
    "jinja2>=3.1.0,<4",
]

[project.scripts]
cyberlab = "cyberlab.cli.app:main"

[build-system]
requires = ["uv_build>=0.11.21,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "coverage>=7.15.0",
    "mypy>=2.1.0",
    "pre-commit>=4.6.0",
    "pytest>=9.1.1",
    "ruff>=0.15.20",
    "types-pyyaml>=6.0.12.20260518",
]

[tool.ruff]
line-length = 100
target-version = "py312"
fix = true

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "UP",
    "B",
]
ignore = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.coverage.run]
source = ["src/cyberlab"]

[tool.coverage.html]
directory = "htmlcov"

[tool.coverage.report]
show_missing = true

[tool.mypy]
python_version = "3.12"
strict = true
pretty = true
# REMOVA o files = ["src"] se for rodar via --package
# Ou use isto para forçar a estrutura correta:
mypy_path = "src"
explicit_package_bases = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = ["--import-mode=importlib"]
