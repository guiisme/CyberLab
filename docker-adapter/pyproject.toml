[build-system]
requires = ["uv_build>=0.11.21,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "cyberlab_plugin_docker_adapter"

[project]
name = "docker-adapter"
version = "0.1.0"
description = "Um novo plugin para o CyberLab"
readme = "README.md"
requires-python = ">=3.12"

dependencies = [
    "cyberlab",
]

[project.entry-points."cyberlab.plugins"]
"docker-adapter" = "cyberlab_plugin_docker_adapter.plugin:DockerAdapterPlugin"
