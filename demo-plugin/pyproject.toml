[build-system]
requires = ["uv_build>=0.11.21,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "cyberlab_plugin_demo_plugin"

[project]
name = "demo-plugin"
version = "0.1.0"
description = "Demo Plugin"
readme = "README.md"
requires-python = ">=3.12"

dependencies = [
    "cyberlab",
]

[tool.uv.sources]
cyberlab = { path = "..", editable = true }

[project.urls]
Homepage = "https://github.com/guiisme84/CyberLab"
Repository = "https://github.com/guiisme84/CyberLab"

[project.entry-points."cyberlab.plugins"]
"demo-plugin" = "cyberlab_plugin_demo_plugin.plugin:DemoPlugin"
